shell /usr/bin/zsh

# BEGIN_KITTY_THEME
# # Night Owl
# include current-theme.conf
include themes/catpuccin-mocha.conf
# END_KITTY_THEME
# font_family JetBrainsMono Nerd Font
# bold_font auto
# italic_font auto
# bold_italic_font auto

font_size 12
 
background_opacity 0.95

window_margin_width 7
window_border_width 2pt

# background_image ~/Downloads/pexels-pixabay-268533.png
# background_image /usr/share/backgrounds/Province_of_the_south_of_france_by_orbitelambda.jpg
# background_image ~/Downloads/Province_of_the_south_of_france_by_orbitelambda.jpg
# background_image ~/ssd/walls/anime/a_cartoon_of_a_girl_standing_next_to_a_car.jpg
# background_image_layout scaled
background_tint 0.90
background_tint_gaps 20
# background_tint_gaps 0

tab_bar_style powerline
tab_powerline_style slanted
tab_activity_symbol *

map ctrl+shift+n launch --type=window --cwd=current 
map ctrl+shift+h neighboring_window left
map ctrl+shift+l neighboring_window right
map ctrl+shift+k neighboring_window up
map ctrl+shift+j neighboring_window down
map alt+l next_layout
map alt+shift+1 goto_tab 1
map alt+shift+2 goto_tab 2
map alt+shift+3 goto_tab 3
map alt+shift+4 goto_tab 4
map alt+shift+5 goto_tab 5 
map alt+shift+6 goto_tab 6
map alt+shift+7 goto_tab 7
map alt+shift+8 goto_tab 8
map alt+shift+9 goto_tab 9
map alt+shift+0 goto_tab 10
# map ctrl+shift+t launch --cwd=current --type=tab

hide_window_decorations yes
# confirm_os_window_close 0
# shell_integration enabled
allow_remote_control yes

enabled_layouts tall, fat, splits, grid

# smear effect
# Enable cursor trail with duration threshold (ms)
cursor_trail 1

# How long the trail lingers (fastest and slowest decay)
cursor_trail_decay 0.1 0.4

# Threshold for starting the trail (cells moved)
cursor_trail_start_threshold 2

# Optional: color of the trail
# cursor_trail_color #88c0d0
cursor_trail_color #89b4fa



# for fullscreen during startup
startup_session ~/.config/kitty/startup.session


# BEGIN_KITTY_FONTS
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
# END_KITTY_FONTS
